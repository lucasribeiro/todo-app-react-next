<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My HTML App</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Welcome to My HTML App</h1>
    </header>

    <div class="container my-4">
        <form id="todo-form" class="d-flex gap-2 mb-2" novalidate>
            <input
                type="text"
                id="todo-input"
                class="form-control"
                placeholder="Digite uma tarefa (Ex: Estudar JavaScript)"
                autocomplete="off"
            >
            <button type="submit" class="btn btn-primary">Adicionar</button>
        </form>
        <div id="todo-error" class="text-danger small mb-3"></div>

        <ul id="todo-list" class="list-group"></ul>
    </div>

    <footer>
        <p>My HTML App &copy; 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
